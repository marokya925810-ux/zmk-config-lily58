# Battery reporting interval in seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Keyboard debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# Increase BLE radio power for better connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Keyboard display name
CONFIG_ZMK_KEYBOARD_NAME="PandaKB_Lily58"
# Fix Windows battery report errors
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# OLED configuration
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Sleep configuration - DISABLED to fix OLED bug
CONFIG_ZMK_SLEEP=n

# RGB Underglow (Right Side)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=120
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=80

# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_BLE=y
